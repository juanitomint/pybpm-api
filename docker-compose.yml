version: "3"


services:
  db:
    image: postgres:18-alpine
    container_name: pybpm-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pybpm_user}
      # change the password below and keep it for installation
      POSTGRES_PASSWORD: "${DB_PASSWORD:?ERROR: DB_PASSWORD must be set in .env}"
      POSTGRES_DB: ${DB_NAME:-pybpm_db}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pybpm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
  pybpm-api:
    image: juanitomint/pybpm-api:latest
    container_name: pybpm-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      APP_EXTRA: --reload
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-pybpm_user}:${DB_PASSWORD}@pybpm-api-db:5432/${DB_NAME:-pybpm_db}
      SECRET_KEY: "${SECRET_KEY:?ERROR: SECRET_KEY must be set in .env}"
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      ADMIN_GROUP_ID: ${ADMIN_GROUP_ID:-1}
      AUTODISCOVER_PATHS: ${AUTODISCOVER_PATHS:-false}
      UPLOAD_FOLDER: /tmp/pybpm_uploads
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy

  pybpm-admin:
    image: juanitomint/pybpm-admin:latest
    container_name: pybpm-admin
    environment:
      PYBPM_API_URL: http://pybpm-api:5000
      APP_PORT: 8080
      APP_EXTRA: --reload
    volumes:
      - ../pybpm-admin/main.py:/app/main.py
      - ../pybpm-admin/static:/app/static
      - ../pybpm-admin/templates:/app/templates
    ports:
      - "8080:8080"
