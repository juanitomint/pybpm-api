[project]
name = "bpm-engine-fastapi"
version = "0.1.0"
description = "Migrated PHP HMVC BPM Engine Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
   "fastapi>=0.115.0",           # High-performance web framework
   "uvicorn[standard]>=0.30.0",  # ASGI server to run the development app
   "pydantic-settings>=2.4.0",   # Environment variable management via Pydantic v2
   "sqlalchemy[asyncio]>=2.0.0", # Async SQL Toolkit and Object-Relational Mapper
   "alembic>=1.13.0",            # Database migration tool configured for async
   "asyncpg>=0.29.0",            # Fast, async PostgreSQL driver (Change to aiomysql if using MySQL)
   "passlib[bcrypt]>=1.7.4",     # Secure password hashing for user/auth tasks
   "python-jose[cryptography]>=3.3.0", # JWT generation and validation
   "python-multipart>=0.0.32",
   "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
   "pytest>=8.0.0",              # Testing framework
   "pytest-asyncio>=0.23.0",     # Allows testing async FastAPI endpoints
   "httpx>=0.27.0",              # Async HTTP client used for pytest for API integration tests
   "black>=24.0.0",              # Uncompromising code formatter (highly recommended for agents)
   "ruff>=0.5.0",                # Ultra-fast linter to enforce code quality
   "debugpy>=1.8.21",
   "httpie>=3.2.4",
]
